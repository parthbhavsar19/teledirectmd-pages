name: FluHub weekly refresh

# CDC publishes FluView on Fridays around midday Eastern. This pulls every FluHub source,
# rebuilds teledirectmd.com/flu-hub/ into public/flu-hub/, and commits the result; the push
# to main triggers the normal Vercel production deploy. The main site build never calls CDC.
on:
  schedule:
    - cron: "17 20 * * 5"   # Fridays 20:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flu-hub-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Fetch CDC data
        working-directory: fluhub
        run: node scripts/fetch-data.mjs
      - name: Build FluHub into public/flu-hub
        working-directory: fluhub
        env:
          OUT_ROOT: ../public
          BASE_PATH: flu-hub
        run: node scripts/build.mjs
      - name: Commit and push
        run: |
          git config user.name "fluhub-bot"
          git config user.email "fluhub-bot@users.noreply.github.com"
          git add fluhub/data/*.json public/flu-hub
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "FluHub: weekly CDC data refresh $(date -u +%F)"
          git push
