<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="ec-title ec-desc" font-family="-apple-system, 'Segoe UI', Arial, sans-serif">
  <title id="ec-title">How to clean your child's eye and give eye drops</title>
  <desc id="ec-desc">Six numbered steps for cleaning a child's eye and administering eye drops or ointment safely.</desc>
  <rect width="900" height="470" fill="#ffffff"/>
  <text x="450" y="38" text-anchor="middle" font-size="21" font-weight="700" fill="#16213e">How to clean your child's eye and give drops</text>
  <text x="450" y="62" text-anchor="middle" font-size="13" fill="#5a6270">Use a fresh part of the cloth for each wipe to avoid spreading infection between eyes.</text>

  <g><circle cx="62" cy="112" r="17" fill="#2563eb"/><text x="62" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">1</text><text x="100" y="119" font-size="15" fill="#16213e">Wash your hands before touching the eye.</text></g>
  <g><circle cx="62" cy="170" r="17" fill="#2563eb"/><text x="62" y="176" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">2</text><text x="100" y="177" font-size="15" fill="#16213e">Dampen a clean cloth or cotton pad with warm water.</text></g>
  <g><circle cx="62" cy="228" r="17" fill="#2563eb"/><text x="62" y="234" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">3</text><text x="100" y="235" font-size="15" fill="#16213e">Wipe from the inner corner outward, once per pass, fresh cloth each pass.</text></g>
  <g><circle cx="62" cy="286" r="17" fill="#2563eb"/><text x="62" y="292" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">4</text><text x="100" y="293" font-size="15" fill="#16213e">For drops: pull the lower lid down and place the drop in the pocket.</text></g>
  <g><circle cx="62" cy="344" r="17" fill="#2563eb"/><text x="62" y="350" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">5</text><text x="100" y="351" font-size="15" fill="#16213e">Do not let the dropper or tube tip touch the eye or the skin.</text></g>
  <g><circle cx="62" cy="402" r="17" fill="#2563eb"/><text x="62" y="408" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">6</text><text x="100" y="409" font-size="15" fill="#16213e">Wash your hands again when you are done.</text></g>

  <text x="450" y="452" text-anchor="middle" font-size="12" fill="#5a6270">If both eyes are infected, clean each eye with a separate cloth.</text>
</svg>