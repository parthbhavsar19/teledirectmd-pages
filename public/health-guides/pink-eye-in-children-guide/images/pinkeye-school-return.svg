<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="sr-title sr-desc" font-family="-apple-system, 'Segoe UI', Arial, sans-serif">
  <title id="sr-title">How long until my child can go back to school or daycare</title>
  <desc id="sr-desc">A horizontal bar chart showing the approximate exclusion window for bacterial, viral, and allergic pink eye.</desc>
  <rect width="900" height="360" fill="#ffffff"/>
  <text x="450" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#16213e">How long until my child can go back?</text>

  <!-- axis / y labels -->
  <text x="180" y="100" font-size="14" font-weight="600" fill="#16213e" text-anchor="end">Allergic</text>
  <text x="180" y="170" font-size="14" font-weight="600" fill="#16213e" text-anchor="end">Bacterial</text>
  <text x="180" y="240" font-size="14" font-weight="600" fill="#16213e" text-anchor="end">Viral</text>

  <!-- axis line -->
  <line x1="200" y1="60" x2="200" y2="270" stroke="#c8cdd5" stroke-width="2"/>

  <!-- Allergic: no bar, just text -->
  <text x="212" y="104" font-size="13.5" fill="#3a4356">No exclusion, never contagious</text>

  <!-- Bacterial: ~1 day -->
  <rect x="200" y="158" width="44" height="24" rx="5" fill="#d97706"/>
  <text x="258" y="176" font-size="13.5" fill="#3a4356">About 1 day after starting drops</text>

  <!-- Viral: ~10 days -->
  <rect x="200" y="228" width="440" height="24" rx="5" fill="#2563eb"/>
  <text x="652" y="246" font-size="13.5" fill="#3a4356">7 to 10 days</text>

  <!-- scale ticks -->
  <text x="200" y="300" font-size="11" fill="#9aa1ad" text-anchor="middle">0</text>
  <text x="420" y="300" font-size="11" fill="#9aa1ad" text-anchor="middle">5 days</text>
  <text x="640" y="300" font-size="11" fill="#9aa1ad" text-anchor="middle">10 days</text>
  <line x1="200" y1="276" x2="200" y2="284" stroke="#c8cdd5"/>
  <line x1="420" y1="276" x2="420" y2="284" stroke="#c8cdd5"/>
  <line x1="640" y1="276" x2="640" y2="284" stroke="#c8cdd5"/>

  <text x="450" y="340" text-anchor="middle" font-size="12" fill="#5a6270">Many facilities use their own rules. Check with your child's school or daycare.</text>
</svg>