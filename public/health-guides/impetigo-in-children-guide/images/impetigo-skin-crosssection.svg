<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" role="img" aria-labelledby="sk-title sk-desc" font-family="-apple-system, 'Segoe UI', Arial, sans-serif">
  <title id="sk-title">Where impetigo forms in the skin (cross-section)</title>
  <desc id="sk-desc">A cross-section of skin showing impetigo as a superficial infection of the epidermis, with the honey-colored crust on the surface and the deeper dermis largely unaffected.</desc>
  <rect width="680" height="400" fill="#fff"/>

  <!-- epidermis (top layer) -->
  <rect x="170" y="110" width="450" height="52" fill="#ecd0a4" stroke="#c9a05f" stroke-width="1.5"/>
  <line x1="170" y1="116" x2="620" y2="116" stroke="#d8b478" stroke-width="1"/>

  <!-- dermis (deeper layer) -->
  <rect x="170" y="162" width="450" height="130" fill="#eec3ae" stroke="#d29877" stroke-width="1.5"/>

  <!-- blood vessels in dermis -->
  <g stroke="#c2433c" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M 210 240 C 250 230, 290 250, 330 238"/>
    <path d="M 430 250 C 475 240, 520 256, 560 244"/>
  </g>

  <!-- honey-colored crust -->
  <g>
    <path d="M 300 110 C 310 64, 470 64, 480 110 Z" fill="#e0a23c"/>
    <path d="M 330 108 C 340 82, 420 82, 430 108 Z" fill="#c98a2e"/>
    <ellipse cx="365" cy="94" rx="26" ry="12" fill="#a8681f" opacity="0.6"/>
    <ellipse cx="415" cy="102" rx="18" ry="8" fill="#c98a2e"/>
  </g>

  <!-- shallow erosion into the epidermis -->
  <path d="M 342 110 C 360 128, 420 128, 438 110 Z" fill="#dfb582"/>

  <!-- bacteria in the epidermis -->
  <g fill="#6b4a1f">
    <circle cx="355" cy="118" r="3.5"/>
    <circle cx="372" cy="122" r="3.5"/>
    <circle cx="390" cy="117" r="3.5"/>
    <circle cx="406" cy="123" r="3.5"/>
    <circle cx="422" cy="118" r="3.5"/>
  </g>

  <!-- labels -->
  <line x1="468" y1="82" x2="540" y2="52" stroke="#8fa0aa" stroke-width="1.5"/>
  <circle cx="468" cy="82" r="3.5" fill="#8fa0aa"/>
  <text x="546" y="40" font-size="13" font-weight="700" fill="#0f3d4e">Honey-colored crust</text>
  <text x="546" y="57" font-size="11.5" fill="#5f707a">dried fluid and bacteria</text>

  <line x1="170" y1="136" x2="138" y2="104" stroke="#8fa0aa" stroke-width="1.5"/>
  <circle cx="170" cy="136" r="3.5" fill="#8fa0aa"/>
  <text x="10" y="86" font-size="13" font-weight="700" fill="#0f3d4e">Epidermis (top)</text>
  <text x="10" y="103" font-size="11.5" fill="#5f707a">impetigo stays here,</text>
  <text x="10" y="119" font-size="11.5" fill="#5f707a">so it is superficial</text>

  <line x1="170" y1="226" x2="138" y2="226" stroke="#8fa0aa" stroke-width="1.5"/>
  <circle cx="170" cy="226" r="3.5" fill="#8fa0aa"/>
  <text x="10" y="240" font-size="13" font-weight="700" fill="#0f3d4e">Dermis (deeper)</text>
  <text x="10" y="257" font-size="11.5" fill="#5f707a">largely unaffected</text>

  <text x="395" y="330" text-anchor="middle" font-size="12" fill="#8fa0aa">Illustration, not a photo. Not to scale.</text>
</svg>