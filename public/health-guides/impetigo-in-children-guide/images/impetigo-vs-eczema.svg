<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="ie-title ie-desc" font-family="-apple-system, 'Segoe UI', Arial, sans-serif">
  <title id="ie-title">Impetigo vs eczema: how to tell them apart</title>
  <desc id="ie-desc">A side-by-side comparison of impetigo and eczema across what it is, how it looks, where it appears, contagiousness, and treatment.</desc>
  <rect width="900" height="470" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#16213e">Impetigo or eczema?</text>
  <text x="450" y="56" text-anchor="middle" font-size="13" fill="#5a6270">A child with eczema can also get impetigo on top of it.</text>

  <!-- Impetigo -->
  <g>
    <rect x="20" y="76" width="415" height="46" rx="6" fill="#b45309"/>
    <text x="228" y="105" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Impetigo</text>
    <text x="34" y="146" font-size="13" font-weight="700" fill="#16213e">What it is</text>
    <text x="34" y="164" font-size="13" fill="#3a4356">A bacterial skin infection</text>
    <text x="34" y="202" font-size="13" font-weight="700" fill="#16213e">Looks like</text>
    <text x="34" y="220" font-size="13" fill="#3a4356">Sores that crust into a honey-yellow scab</text>
    <text x="34" y="258" font-size="13" font-weight="700" fill="#16213e">Where</text>
    <text x="34" y="276" font-size="13" fill="#3a4356">Around the nose and mouth</text>
    <text x="34" y="314" font-size="13" font-weight="700" fill="#16213e">Contagious</text>
    <text x="34" y="332" font-size="13" fill="#3a4356">Yes, until 24 hours on antibiotics</text>
    <text x="34" y="370" font-size="13" font-weight="700" fill="#16213e">Treatment</text>
    <text x="34" y="388" font-size="13" fill="#3a4356">Antibiotic ointment or pills</text>
  </g>

  <!-- Eczema -->
  <g>
    <rect x="465" y="76" width="415" height="46" rx="6" fill="#059669"/>
    <text x="673" y="105" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Eczema (atopic dermatitis)</text>
    <text x="479" y="146" font-size="13" font-weight="700" fill="#16213e">What it is</text>
    <text x="479" y="164" font-size="13" fill="#3a4356">A chronic inflammatory condition</text>
    <text x="479" y="202" font-size="13" font-weight="700" fill="#16213e">Looks like</text>
    <text x="479" y="220" font-size="13" fill="#3a4356">Dry, red, itchy patches</text>
    <text x="479" y="258" font-size="13" font-weight="700" fill="#16213e">Where</text>
    <text x="479" y="276" font-size="13" fill="#3a4356">Creases of the elbows and knees</text>
    <text x="479" y="314" font-size="13" font-weight="700" fill="#16213e">Contagious</text>
    <text x="479" y="332" font-size="13" fill="#3a4356">No</text>
    <text x="479" y="370" font-size="13" font-weight="700" fill="#16213e">Treatment</text>
    <text x="479" y="388" font-size="13" fill="#3a4356">Moisturizer; steroid only if prescribed</text>
  </g>

  <text x="450" y="452" text-anchor="middle" font-size="12" fill="#5a6270">If a child with eczema develops oozing, crusting sores, see a clinician.</text>
</svg>