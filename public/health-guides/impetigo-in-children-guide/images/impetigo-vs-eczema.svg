<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 530" role="img" aria-labelledby="ie-t ie-d" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <title id="ie-t">Impetigo or eczema?</title>
  <desc id="ie-d">Side-by-side comparison of impetigo and eczema.</desc>
  <rect width="920" height="530" fill="#ffffff"/>

<text x="460.0" y="34" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="2.5" fill="#0e7d86">AT A GLANCE</text>
  <text x="460.0" y="62" text-anchor="middle" font-size="24" font-weight="700" fill="#0f3d4e">Impetigo or eczema?</text>
  <rect x="434.0" y="76" width="52" height="3" rx="1.5" fill="#0e7d86"/>
  <text x="460.0" y="101" text-anchor="middle" font-size="13" fill="#5f707a">A child with eczema can also get impetigo on top of it.</text>
<rect x="28" y="136.5" width="422" height="366" rx="14" fill="#e8f0f2"/>
  <rect x="26" y="133" width="422" height="366" rx="14" fill="#ffffff" stroke="#dfe6ea" stroke-width="1.5"/>
  <path d="M 26,147 A 14,14 0 0 1 40,133 L 434,133 A 14,14 0 0 1 448,147 L 448,185 L 26,185 Z" fill="#c07a2a"/>
  <text x="237.0" y="164.5" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Impetigo</text>
  <text x="44" y="207" font-size="10.5" font-weight="700" letter-spacing="1" fill="#c07a2a">WHAT IT IS</text>
  <text x="44" y="227" font-size="14" font-weight="500" fill="#24353e">A bacterial skin infection</text>
  <line x1="42" y1="238" x2="432" y2="238" stroke="#edf2f5" stroke-width="1"/>
  <text x="44" y="265" font-size="10.5" font-weight="700" letter-spacing="1" fill="#c07a2a">LOOKS LIKE</text>
  <text x="44" y="285" font-size="14" font-weight="500" fill="#24353e">Sores that crust into a honey-yellow scab</text>
  <line x1="42" y1="296" x2="432" y2="296" stroke="#edf2f5" stroke-width="1"/>
  <text x="44" y="323" font-size="10.5" font-weight="700" letter-spacing="1" fill="#c07a2a">WHERE</text>
  <text x="44" y="343" font-size="14" font-weight="500" fill="#24353e">Around the nose and mouth</text>
  <line x1="42" y1="354" x2="432" y2="354" stroke="#edf2f5" stroke-width="1"/>
  <text x="44" y="381" font-size="10.5" font-weight="700" letter-spacing="1" fill="#c07a2a">CONTAGIOUS</text>
  <text x="44" y="401" font-size="14" font-weight="500" fill="#24353e">Yes, until 24 hours on antibiotics</text>
  <line x1="42" y1="412" x2="432" y2="412" stroke="#edf2f5" stroke-width="1"/>
  <text x="44" y="439" font-size="10.5" font-weight="700" letter-spacing="1" fill="#c07a2a">TREATMENT</text>
  <text x="44" y="459" font-size="14" font-weight="500" fill="#24353e">Antibiotic ointment or pills</text>
<rect x="474" y="136.5" width="422" height="366" rx="14" fill="#e8f0f2"/>
  <rect x="472" y="133" width="422" height="366" rx="14" fill="#ffffff" stroke="#dfe6ea" stroke-width="1.5"/>
  <path d="M 472,147 A 14,14 0 0 1 486,133 L 880,133 A 14,14 0 0 1 894,147 L 894,185 L 472,185 Z" fill="#3a8f68"/>
  <text x="683.0" y="164.5" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Eczema (atopic dermatitis)</text>
  <text x="490" y="207" font-size="10.5" font-weight="700" letter-spacing="1" fill="#3a8f68">WHAT IT IS</text>
  <text x="490" y="227" font-size="14" font-weight="500" fill="#24353e">A chronic inflammatory condition</text>
  <line x1="488" y1="238" x2="878" y2="238" stroke="#edf2f5" stroke-width="1"/>
  <text x="490" y="265" font-size="10.5" font-weight="700" letter-spacing="1" fill="#3a8f68">LOOKS LIKE</text>
  <text x="490" y="285" font-size="14" font-weight="500" fill="#24353e">Dry, red, itchy patches</text>
  <line x1="488" y1="296" x2="878" y2="296" stroke="#edf2f5" stroke-width="1"/>
  <text x="490" y="323" font-size="10.5" font-weight="700" letter-spacing="1" fill="#3a8f68">WHERE</text>
  <text x="490" y="343" font-size="14" font-weight="500" fill="#24353e">Creases of the elbows and knees</text>
  <line x1="488" y1="354" x2="878" y2="354" stroke="#edf2f5" stroke-width="1"/>
  <text x="490" y="381" font-size="10.5" font-weight="700" letter-spacing="1" fill="#3a8f68">CONTAGIOUS</text>
  <text x="490" y="401" font-size="14" font-weight="500" fill="#24353e">No</text>
  <line x1="488" y1="412" x2="878" y2="412" stroke="#edf2f5" stroke-width="1"/>
  <text x="490" y="439" font-size="10.5" font-weight="700" letter-spacing="1" fill="#3a8f68">TREATMENT</text>
  <text x="490" y="459" font-size="14" font-weight="500" fill="#24353e">Moisturizer; steroid only if prescribed</text>
<text x="460.0" y="510" text-anchor="middle" font-size="12" fill="#8fa0aa">If a child with eczema develops oozing, crusting sores, see a clinician.</text>
</svg>