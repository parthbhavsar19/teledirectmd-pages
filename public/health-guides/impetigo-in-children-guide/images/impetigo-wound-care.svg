<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" role="img" aria-labelledby="imc-t imc-d" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <title id="imc-t">How to care for impetigo at home</title>
  <desc id="imc-d">Six numbered steps for caring for impetigo sores at home.</desc>
  <rect width="920" height="500" fill="#ffffff"/>

<text x="460.0" y="34" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="2.5" fill="#0e7d86">STEP BY STEP</text>
  <text x="460.0" y="62" text-anchor="middle" font-size="24" font-weight="700" fill="#0f3d4e">How to care for impetigo at home</text>
  <rect x="434.0" y="76" width="52" height="3" rx="1.5" fill="#0e7d86"/>
  <text x="460.0" y="101" text-anchor="middle" font-size="13" fill="#5f707a">Crusts must come off gently so the antibiotic can reach the skin underneath.</text>
<line x1="130" y1="129" x2="130" y2="431" stroke="#dfe6ea" stroke-width="2"/>
<circle cx="130" cy="135" r="20" fill="#f6fafb" stroke="#dfe6ea" stroke-width="1.5"/>
<circle cx="130" cy="135" r="13" fill="#c07a2a"/>
<text x="130" y="139.5" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">1</text>
<text x="168" y="139.5" font-size="15" fill="#24353e">Wash your hands before and after touching the sores.</text>
<circle cx="130" cy="193" r="20" fill="#f6fafb" stroke="#dfe6ea" stroke-width="1.5"/>
<circle cx="130" cy="193" r="13" fill="#c07a2a"/>
<text x="130" y="197.5" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">2</text>
<text x="168" y="197.5" font-size="15" fill="#24353e">Soak the crusts with a warm, wet cloth for a few minutes to soften them.</text>
<circle cx="130" cy="251" r="20" fill="#f6fafb" stroke="#dfe6ea" stroke-width="1.5"/>
<circle cx="130" cy="251" r="13" fill="#c07a2a"/>
<text x="130" y="255.5" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">3</text>
<text x="168" y="255.5" font-size="15" fill="#24353e">Gently wipe away the softened crusts.</text>
<circle cx="130" cy="309" r="20" fill="#f6fafb" stroke="#dfe6ea" stroke-width="1.5"/>
<circle cx="130" cy="309" r="13" fill="#c07a2a"/>
<text x="130" y="313.5" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">4</text>
<text x="168" y="313.5" font-size="15" fill="#24353e">Apply a thin layer of the antibiotic ointment exactly as prescribed.</text>
<circle cx="130" cy="367" r="20" fill="#f6fafb" stroke="#dfe6ea" stroke-width="1.5"/>
<circle cx="130" cy="367" r="13" fill="#c07a2a"/>
<text x="130" y="371.5" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">5</text>
<text x="168" y="371.5" font-size="15" fill="#24353e">Cover the sores loosely with nonstick gauze.</text>
<circle cx="130" cy="425" r="20" fill="#f6fafb" stroke="#dfe6ea" stroke-width="1.5"/>
<circle cx="130" cy="425" r="13" fill="#c07a2a"/>
<text x="130" y="429.5" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">6</text>
<text x="168" y="429.5" font-size="15" fill="#24353e">Wash linens and towels daily in hot water; keep fingernails short.</text>
<text x="460.0" y="480" text-anchor="middle" font-size="12" fill="#8fa0aa">Do not share towels, washcloths, or clothing during the contagious period.</text>
</svg>