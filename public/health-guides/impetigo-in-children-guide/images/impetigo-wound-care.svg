<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="imc-title imc-desc" font-family="-apple-system, 'Segoe UI', Arial, sans-serif">
  <title id="imc-title">How to care for impetigo at home</title>
  <desc id="imc-desc">Six numbered steps for caring for impetigo sores at home: wash, soak, remove crusts, apply ointment, cover, and launder.</desc>
  <rect width="900" height="470" fill="#ffffff"/>
  <text x="450" y="38" text-anchor="middle" font-size="21" font-weight="700" fill="#16213e">How to care for impetigo at home</text>
  <text x="450" y="62" text-anchor="middle" font-size="13" fill="#5a6270">Crusts must come off gently so the antibiotic can reach the skin underneath.</text>

  <g><circle cx="62" cy="112" r="17" fill="#b45309"/><text x="62" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">1</text><text x="100" y="119" font-size="15" fill="#16213e">Wash your hands before and after touching the sores.</text></g>
  <g><circle cx="62" cy="170" r="17" fill="#b45309"/><text x="62" y="176" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">2</text><text x="100" y="177" font-size="15" fill="#16213e">Soak the crusts with a warm, wet cloth for a few minutes to soften them.</text></g>
  <g><circle cx="62" cy="228" r="17" fill="#b45309"/><text x="62" y="234" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">3</text><text x="100" y="235" font-size="15" fill="#16213e">Gently wipe away the softened crusts.</text></g>
  <g><circle cx="62" cy="286" r="17" fill="#b45309"/><text x="62" y="292" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">4</text><text x="100" y="293" font-size="15" fill="#16213e">Apply a thin layer of the antibiotic ointment exactly as prescribed.</text></g>
  <g><circle cx="62" cy="344" r="17" fill="#b45309"/><text x="62" y="350" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">5</text><text x="100" y="351" font-size="15" fill="#16213e">Cover the sores loosely with nonstick gauze.</text></g>
  <g><circle cx="62" cy="402" r="17" fill="#b45309"/><text x="62" y="408" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">6</text><text x="100" y="409" font-size="15" fill="#16213e">Wash linens and towels daily in hot water; keep fingernails short.</text></g>

  <text x="450" y="452" text-anchor="middle" font-size="12" fill="#5a6270">Do not share towels, washcloths, or clothing during the contagious period.</text>
</svg>