<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 530" role="img" aria-labelledby="im-t im-d" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <title id="im-t">The three forms of impetigo</title>
  <desc id="im-d">Three panels comparing classic, bullous, and ecthyma impetigo.</desc>
  <rect width="920" height="530" fill="#ffffff"/>

<text x="460.0" y="34" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="2.5" fill="#0e7d86">AT A GLANCE</text>
  <text x="460.0" y="62" text-anchor="middle" font-size="24" font-weight="700" fill="#0f3d4e">The three forms of impetigo</text>
  <rect x="434.0" y="76" width="52" height="3" rx="1.5" fill="#0e7d86"/>
  <text x="460.0" y="101" text-anchor="middle" font-size="13" fill="#5f707a">They look different, and the treatment differs too.</text>
<rect x="28" y="136.5" width="276" height="366" rx="14" fill="#e8f0f2"/>
  <rect x="26" y="133" width="276" height="366" rx="14" fill="#ffffff" stroke="#dfe6ea" stroke-width="1.5"/>
  <path d="M 26,147 A 14,14 0 0 1 40,133 L 288,133 A 14,14 0 0 1 302,147 L 302,185 L 26,185 Z" fill="#c07a2a"/>
  <text x="164.0" y="164.5" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Classic (nonbullous)</text>
  <text x="44" y="207" font-size="10.5" font-weight="700" letter-spacing="1" fill="#c07a2a">LOOKS LIKE</text>
  <text x="44" y="227" font-size="14" font-weight="500" fill="#24353e">Honey-crusted sores</text>
  <line x1="42" y1="238" x2="286" y2="238" stroke="#edf2f5" stroke-width="1"/>
  <text x="44" y="265" font-size="10.5" font-weight="700" letter-spacing="1" fill="#c07a2a">WHERE</text>
  <text x="44" y="285" font-size="14" font-weight="500" fill="#24353e">Nose, mouth</text>
  <line x1="42" y1="296" x2="286" y2="296" stroke="#edf2f5" stroke-width="1"/>
  <text x="44" y="323" font-size="10.5" font-weight="700" letter-spacing="1" fill="#c07a2a">COMMON AGE</text>
  <text x="44" y="343" font-size="14" font-weight="500" fill="#24353e">2–5 years</text>
  <line x1="42" y1="354" x2="286" y2="354" stroke="#edf2f5" stroke-width="1"/>
  <text x="44" y="381" font-size="10.5" font-weight="700" letter-spacing="1" fill="#c07a2a">CAUSE</text>
  <text x="44" y="401" font-size="14" font-weight="500" fill="#24353e">Staph or strep</text>
  <line x1="42" y1="412" x2="286" y2="412" stroke="#edf2f5" stroke-width="1"/>
  <text x="44" y="439" font-size="10.5" font-weight="700" letter-spacing="1" fill="#c07a2a">TREATMENT</text>
  <text x="44" y="459" font-size="14" font-weight="500" fill="#24353e">Topical (limited)</text>
<rect x="324" y="136.5" width="276" height="366" rx="14" fill="#e8f0f2"/>
  <rect x="322" y="133" width="276" height="366" rx="14" fill="#ffffff" stroke="#dfe6ea" stroke-width="1.5"/>
  <path d="M 322,147 A 14,14 0 0 1 336,133 L 584,133 A 14,14 0 0 1 598,147 L 598,185 L 322,185 Z" fill="#2a8a9a"/>
  <text x="460.0" y="164.5" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Bullous</text>
  <text x="340" y="207" font-size="10.5" font-weight="700" letter-spacing="1" fill="#2a8a9a">LOOKS LIKE</text>
  <text x="340" y="227" font-size="14" font-weight="500" fill="#24353e">Large fluid blisters</text>
  <line x1="338" y1="238" x2="582" y2="238" stroke="#edf2f5" stroke-width="1"/>
  <text x="340" y="265" font-size="10.5" font-weight="700" letter-spacing="1" fill="#2a8a9a">WHERE</text>
  <text x="340" y="285" font-size="14" font-weight="500" fill="#24353e">Trunk, arms, legs</text>
  <line x1="338" y1="296" x2="582" y2="296" stroke="#edf2f5" stroke-width="1"/>
  <text x="340" y="323" font-size="10.5" font-weight="700" letter-spacing="1" fill="#2a8a9a">COMMON AGE</text>
  <text x="340" y="343" font-size="14" font-weight="500" fill="#24353e">Under 2 years</text>
  <line x1="338" y1="354" x2="582" y2="354" stroke="#edf2f5" stroke-width="1"/>
  <text x="340" y="381" font-size="10.5" font-weight="700" letter-spacing="1" fill="#2a8a9a">CAUSE</text>
  <text x="340" y="401" font-size="14" font-weight="500" fill="#24353e">Toxin-producing staph</text>
  <line x1="338" y1="412" x2="582" y2="412" stroke="#edf2f5" stroke-width="1"/>
  <text x="340" y="439" font-size="10.5" font-weight="700" letter-spacing="1" fill="#2a8a9a">TREATMENT</text>
  <text x="340" y="459" font-size="14" font-weight="500" fill="#24353e">Topical or oral</text>
<rect x="620" y="136.5" width="276" height="366" rx="14" fill="#e8f0f2"/>
  <rect x="618" y="133" width="276" height="366" rx="14" fill="#ffffff" stroke="#dfe6ea" stroke-width="1.5"/>
  <path d="M 618,147 A 14,14 0 0 1 632,133 L 880,133 A 14,14 0 0 1 894,147 L 894,185 L 618,185 Z" fill="#c2433c"/>
  <text x="756.0" y="164.5" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Ecthyma (deep)</text>
  <text x="636" y="207" font-size="10.5" font-weight="700" letter-spacing="1" fill="#c2433c">LOOKS LIKE</text>
  <text x="636" y="227" font-size="14" font-weight="500" fill="#24353e">Deep, painful ulcers</text>
  <line x1="634" y1="238" x2="878" y2="238" stroke="#edf2f5" stroke-width="1"/>
  <text x="636" y="265" font-size="10.5" font-weight="700" letter-spacing="1" fill="#c2433c">WHERE</text>
  <text x="636" y="285" font-size="14" font-weight="500" fill="#24353e">Usually the legs</text>
  <line x1="634" y1="296" x2="878" y2="296" stroke="#edf2f5" stroke-width="1"/>
  <text x="636" y="323" font-size="10.5" font-weight="700" letter-spacing="1" fill="#c2433c">COMMON AGE</text>
  <text x="636" y="343" font-size="14" font-weight="500" fill="#24353e">Any age</text>
  <line x1="634" y1="354" x2="878" y2="354" stroke="#edf2f5" stroke-width="1"/>
  <text x="636" y="381" font-size="10.5" font-weight="700" letter-spacing="1" fill="#c2433c">CAUSE</text>
  <text x="636" y="401" font-size="14" font-weight="500" fill="#24353e">Staph or strep, deeper</text>
  <line x1="634" y1="412" x2="878" y2="412" stroke="#edf2f5" stroke-width="1"/>
  <text x="636" y="439" font-size="10.5" font-weight="700" letter-spacing="1" fill="#c2433c">TREATMENT</text>
  <text x="636" y="459" font-size="14" font-weight="500" fill="#24353e">Oral, may scar</text>
<text x="460.0" y="510" text-anchor="middle" font-size="12" fill="#8fa0aa">Widespread blistering with skin peeling is a different, serious condition that needs emergency care.</text>
</svg>