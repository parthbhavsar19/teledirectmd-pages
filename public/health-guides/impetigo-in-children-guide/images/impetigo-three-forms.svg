<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="im-title im-desc" font-family="-apple-system, 'Segoe UI', Arial, sans-serif">
  <title id="im-title">The three forms of impetigo compared</title>
  <desc id="im-desc">Three panels contrasting classic, bullous, and ecthyma impetigo by appearance, location, age, cause, and treatment.</desc>
  <rect width="900" height="470" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#16213e">The three forms of impetigo</text>
  <text x="450" y="56" text-anchor="middle" font-size="13" fill="#5a6270">They look different, and the treatment differs too.</text>

  <!-- Classic -->
  <g>
    <rect x="20" y="76" width="276" height="46" rx="6" fill="#b45309"/>
    <text x="158" y="105" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Classic (nonbullous)</text>
    <text x="32" y="146" font-size="13" font-weight="700" fill="#16213e">Looks like</text>
    <text x="32" y="164" font-size="13" fill="#3a4356">Honey-crusted sores</text>
    <text x="32" y="202" font-size="13" font-weight="700" fill="#16213e">Where</text>
    <text x="32" y="220" font-size="13" fill="#3a4356">Nose, mouth</text>
    <text x="32" y="258" font-size="13" font-weight="700" fill="#16213e">Common age</text>
    <text x="32" y="276" font-size="13" fill="#3a4356">2–5 years</text>
    <text x="32" y="314" font-size="13" font-weight="700" fill="#16213e">Cause</text>
    <text x="32" y="332" font-size="13" fill="#3a4356">Staph or strep</text>
    <text x="32" y="370" font-size="13" font-weight="700" fill="#16213e">Treatment</text>
    <text x="32" y="388" font-size="13" fill="#3a4356">Topical (limited)</text>
  </g>

  <!-- Bullous -->
  <g>
    <rect x="312" y="76" width="276" height="46" rx="6" fill="#0891b2"/>
    <text x="450" y="105" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Bullous</text>
    <text x="324" y="146" font-size="13" font-weight="700" fill="#16213e">Looks like</text>
    <text x="324" y="164" font-size="13" fill="#3a4356">Large fluid blisters</text>
    <text x="324" y="202" font-size="13" font-weight="700" fill="#16213e">Where</text>
    <text x="324" y="220" font-size="13" fill="#3a4356">Trunk, arms, legs</text>
    <text x="324" y="258" font-size="13" font-weight="700" fill="#16213e">Common age</text>
    <text x="324" y="276" font-size="13" fill="#3a4356">Under 2 years</text>
    <text x="324" y="314" font-size="13" font-weight="700" fill="#16213e">Cause</text>
    <text x="324" y="332" font-size="13" fill="#3a4356">Toxin-producing staph</text>
    <text x="324" y="370" font-size="13" font-weight="700" fill="#16213e">Treatment</text>
    <text x="324" y="388" font-size="13" fill="#3a4356">Topical or oral</text>
  </g>

  <!-- Ecthyma -->
  <g>
    <rect x="604" y="76" width="276" height="46" rx="6" fill="#b91c1c"/>
    <text x="742" y="105" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Ecthyma (deep)</text>
    <text x="616" y="146" font-size="13" font-weight="700" fill="#16213e">Looks like</text>
    <text x="616" y="164" font-size="13" fill="#3a4356">Deep, painful ulcers</text>
    <text x="616" y="202" font-size="13" font-weight="700" fill="#16213e">Where</text>
    <text x="616" y="220" font-size="13" fill="#3a4356">Usually the legs</text>
    <text x="616" y="258" font-size="13" font-weight="700" fill="#16213e">Common age</text>
    <text x="616" y="276" font-size="13" fill="#3a4356">Any age</text>
    <text x="616" y="314" font-size="13" font-weight="700" fill="#16213e">Cause</text>
    <text x="616" y="332" font-size="13" fill="#3a4356">Staph or strep, deep</text>
    <text x="616" y="370" font-size="13" font-weight="700" fill="#16213e">Treatment</text>
    <text x="616" y="388" font-size="13" fill="#3a4356">Oral, may scar</text>
  </g>

  <text x="450" y="452" text-anchor="middle" font-size="12" fill="#5a6270">Widespread blistering with skin peeling is a different, serious condition that needs emergency care.</text>
</svg>