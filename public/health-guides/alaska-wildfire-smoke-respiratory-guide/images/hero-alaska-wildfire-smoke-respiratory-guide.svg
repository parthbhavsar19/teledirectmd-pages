      <stop offset="45%" stop-color="#C67D3E"/>
      <stop offset="80%" stop-color="#E4A76B"/>
      <stop offset="100%" stop-color="#F0C58A"/>
    </linearGradient>
    <linearGradient id="mountainFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5F5346" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#78685A" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="mountainMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A403A" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#5E524A" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="1" y2="0">
