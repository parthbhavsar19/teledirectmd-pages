<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="hero-title hero-desc" preserveAspectRatio="xMidYMid meet">
  <title id="hero-title">Wildfire smoke settling over Interior Alaska</title>
  <desc id="hero-desc">Stylized illustration of a smoke-filled valley between low mountain ranges with boreal spruce forest in the foreground, a sun obscured by orange-brown smoke haze, and a village of small structures near a river.</desc>

  <defs>
